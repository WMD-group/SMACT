name: Draft JOSS PDF

on:
  push:
    branches: [docs/regenerate-joss-pdf]
    paths:
      - joss/paper.md
      - joss/paper.bib
      - .github/workflows/draft-pdf.yml
  workflow_dispatch: {}

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: joss/paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: joss/paper.pdf
